# Render Blueprint — Jurisly API (NestJS), production only (branch: main).
# Apply from the Render dashboard: New → Blueprint → connect this repo.
# Set secret env vars in the Render UI (DATABASE_URL, BETTER_AUTH_SECRET, …) — see docs/DEPLOYMENT-FREE-TIER.md and docs/DEPLOYMENT-PRODUCTION.md
services:
  - type: web
    name: jurisly-api
    branch: main
    runtime: node
    plan: free
    buildCommand: corepack prepare pnpm@10.33.0 --activate && pnpm install --ignore-scripts && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: VAULT_MALWARE_SCAN_PROVIDER
        value: stub
