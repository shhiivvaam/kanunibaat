name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=6144
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci
  BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:4000
  CORS_ORIGIN: http://localhost:3000

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve dependency build scripts
        run: pnpm approve-builds --all

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: API E2E tests
        run: pnpm --filter api test:e2e

      - name: Mobile — Expo Doctor
        run: pnpm --filter mobile run expo-doctor

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          set -e
          test -f apps/api/dist/main.js
          test -f apps/web/.next/BUILD_ID
          test -d apps/mobile/dist
          test -n "$(find apps/mobile/dist -type f | head -n 1)"

      - name: Smoke — API server responds
        run: |
          set -e
          node apps/api/dist/main.js &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:4000/" | grep -q "Hello World"; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy in time"
          exit 1
        env:
          PORT: '4000'
